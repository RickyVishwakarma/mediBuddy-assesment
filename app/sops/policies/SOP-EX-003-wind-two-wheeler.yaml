id: SOP-EX-003
title: Gusty crosswinds while riding two wheels
category: outdoor_exercise
severity: warning
override: false

applies_to:
  activities: [cycling, motorcycle]
  intent_hint: "user is riding something with two wheels, pedal-powered or motorised"

# Keyed on gust DIFFERENTIAL rather than raw wind speed, because that is what actually
# unseats a rider. A steady 45 km/h headwind is exhausting but predictable: you lean into
# it and it stays there. A 20 km/h prevailing wind with 55 km/h gusts is the dangerous
# one, because the load arrives with no warning and from the side. Raw speed cannot tell
# those apart, so a threshold on speed alone both misses the gusty-but-calm-average day
# and over-warns on the steady-headwind day.
#
# Two branches:
#   - a gust arriving 20+ km/h above the prevailing wind, once gusts clear 45
#   - any gust at 65+, where the absolute force is enough regardless of differential
#
# Note the advice below avoids asserting that the wind is *gusty rather than strong*: the
# second branch fires on a steady 62 km/h gusting to 66, where that would be untrue. A
# rule's advice has to hold for every condition that can trigger it.
match:
  any:
    - all:
        - {field: gust_differential_kmh, op: gte, value: 20}
        - {field: wind_gusts_kmh, op: gte, value: 45}
    - {field: wind_gusts_kmh, op: gte, value: 65}

advice: |
  The wind today is strong enough to be a safety problem on two wheels rather than just
  hard work. What unseats riders is rarely the effort of pushing into it -- it's the
  sideways shove, which arrives without warning and can put you across a lane before you
  react.

  Postpone the ride if you can, or take an enclosed vehicle or public transport instead.
  If you're riding anyway: slow down well below your usual pace, keep both hands on the
  bars, and leave much more space around lorries and buses, whose wake adds to the gust.
  Take particular care at the places gusts funnel or arrive suddenly -- bridges,
  flyovers, gaps between buildings, and the moment you clear a line of trees.

compose_notes: >
  Give the prevailing wind speed and the peak gust as two separate figures, so the user
  can see the gap between them rather than just a single number.

rationale: >
  Gust-induced loss of control is a recognised single-vehicle crash cause for riders, and
  it tracks the gust-to-mean differential rather than mean wind speed. Encoding the
  differential means the rule fires on the genuinely hazardous profile and stays quiet on
  a strong but steady day, which a simple speed threshold cannot do.
