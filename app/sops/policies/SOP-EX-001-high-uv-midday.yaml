id: SOP-EX-001
title: Cumulative UV dose during sustained outdoor activity
category: outdoor_exercise
severity: caution
override: false

# Scoped to activities people stay out in for a while. UV harm is a dose -- intensity
# multiplied by time -- so the activity matters as much as the reading. Ten minutes at
# UV 8 is trivial; two hours at UV 6 is not.
applies_to:
  activities: [cycling, running, hiking, sports, gardening, walking, commute]
  intent_hint: "user plans to be outdoors and exposed for a sustained stretch"

# Threshold sits at 6, not the 8 that marks the "very high" band, precisely because these
# are sustained activities: the dose accumulates past the point a short errand would.
#
# Note there is deliberately NO clock-time condition here. Checking "is it between 11:00
# and 16:00" is a proxy for "is the sun strong"; since the snapshot already computes the
# UV index for the window the user actually asked about, the rule can test the thing
# itself instead of the proxy. Ask about 19:00 and uv_index is low, so this stays quiet
# without needing a rule about hours at all.
# Deliberately a single condition on the WINDOW's own UV reading. An earlier version also
# fired on uv_max_24h >= 9, the day's peak -- which meant asking about 19:00 on a fierce
# day triggered advice opening "the sun is strong enough...", untrue for the window asked
# about. It also reintroduced exactly the proxy this rule exists to avoid: the daily
# maximum stands in for "is the sun strong now" the same way clock hours did.
match:
  {field: uv_index, op: gte, value: 6}

advice: |
  The sun is strong enough that the length of your session matters more than the moment
  you start it. Unprotected skin accumulates damage the whole time you're out, so a long
  easy session in this can cost more than a short hard one.

  Shorten the time exposed, or split it either side of the middle of the day. Broad
  spectrum sunscreen on everything the kit doesn't cover, reapplied roughly every two
  hours and again after heavy sweating, since it stops working well before it feels like
  it has. A peaked cap and UV-blocking sunglasses do more than people expect -- eyes and
  scalp are the spots regular exercisers most often skip.

  Shade matters more than timing: a route with tree cover at UV 8 beats an exposed one at
  UV 6. Reflected UV off water, sand and pale concrete adds meaningfully to the dose, so
  waterside and open-paved routes are worse than they look.

compose_notes: >
  Quote the UV index for the window asked about.

rationale: >
  UV injury is cumulative rather than threshold-based, which is why this is scoped to
  sustained activities and set lower than the "very high" band. Testing the windowed UV
  reading rather than clock hours means the rule follows the actual sun, and keeps
  working for a user asking about a winter afternoon or a tropical morning alike.
