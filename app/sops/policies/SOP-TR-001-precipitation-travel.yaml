id: SOP-TR-001
title: Rain heavy enough to slow a journey
category: travel_commute
severity: advisory
override: false

applies_to:
  activities: [commute, driving, motorcycle, cycling, walking]
  intent_hint: "user is getting somewhere -- to work, to school, across town"

# Keyed on how hard it is actually raining and how far you can see, not on the chance of
# rain. Probability is a poor predictor of disruption: a 90% chance of drizzle delays
# nobody, while a 40% chance that turns into a downpour closes a road. What slows traffic
# is water on the surface and reduced sight lines, so the rule tests those directly.
#
# Rain must actually be falling for this rule to fire. It once also had a
# visibility-only branch, which meant it triggered on fog and then told the user "there's
# enough water coming down to sit on the road surface" while the snapshot said 0.0 mm --
# advice contradicting the data in the same reply. Reduced visibility with no rain is a
# different hazard and now has its own policy, SOP-TR-004.
#
# The lesson generalises: a rule's advice text must be true for EVERY condition that can
# trigger it. An `any:` branch that widens the trigger without fitting the advice is a
# grounding bug the numeric guard cannot catch, because every figure involved is real.
# Two ways a journey gets slower, and the advice below is true for both:
#   - rain already falling hard enough to sit on the road, with sight lines shortened
#   - rain not yet falling but near-certain, which is worth setting off early for
#
# The second branch exists because removing it left a hole: on a day with a 100% chance
# of rain, 1.3 mm fallen so far and 3 km visibility, NO policy fired at all and the bot
# answered "we have no guidance" to an ordinary commuting question. Keying purely on
# intensity fixed one bug (advice asserting wet roads on a dry fog day) and opened
# another. Probability is a poor trigger on its own; it is a perfectly good one for
# "plan around this".
match:
  any:
    - all:
        - {field: precipitation_mm, op: gte, value: 4}
        - {field: visibility_km, op: lte, value: 5}
    - {field: precipitation_probability_pct, op: gte, value: 70}

advice: |
  Expect the journey to be slower than usual rather than dangerous. There's enough rain
  about to affect the roads, whether or not it has started where you are.

  Set off earlier than you would otherwise, take rain protection, and check for service
  alerts or traffic disruption before you leave rather than discovering them en route.
  Water gathers first at underpasses and junctions, so those are where delays build.

  If you're walking or riding, assume drivers will see you later than usual: wear
  something visible, and give up right-of-way rather than insisting on it at crossings.

compose_notes: >
  State the visibility figure, and the rainfall amount where it contributed. Visibility
  is the more concrete of the two for a user deciding whether to leave now or wait.

rationale: >
  Journey disruption tracks rainfall intensity and sight distance, not the probability of
  any rain at all. Keying on probability produces an advisory on days nothing happens and
  stays silent on days it does. Severity is deliberately advisory: this is a planning
  matter, so it must never outrank a genuine hazard in the ranking.
