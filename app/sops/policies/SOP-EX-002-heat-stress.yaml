id: SOP-EX-002
title: Heat stress risk during outdoor exertion
category: outdoor_exercise
severity: warning
override: false

applies_to:
  # `commute` is included deliberately: getting to work in this means walking to a stop,
  # standing on a platform, or riding in it. Leaving it out meant a question about
  # commuting on a 41 C day matched no policy at all and got "we have no guidance".
  # `picnic` and `children_play` added for the same reason `commute` was: the rule was
  # scoped to exertion, but 38 C does not care whether you are running through it or
  # sitting in it, and sitting in it is often the longer exposure.
  activities: [cycling, running, walking, hiking, sports, gardening, general_outdoor,
               commute, picnic, children_play,
               # 43 C reaches a motorcyclist in gear, the person on the other end of the
               # dog lead, and an older adult most of all -- SOP-VG-002 covers them in
               # cold and had no heat equivalent, which is backwards.
               motorcycle, pet_walk, elderly_outing]
  intent_hint: "user plans sustained physical effort outdoors"

# Apparent temperature, not raw temperature: humidity is what defeats sweat cooling,
# and 34 C at 90% humidity is more dangerous than 38 C in dry air.
match:
  any:
    - {field: apparent_temperature_c, op: gte, value: 38}
    - all:
        - {field: apparent_temperature_c, op: gte, value: 33}
        - {field: humidity_pct, op: gte, value: 75}

advice: |
  This is a heat-stress risk, not a comfort complaint. Hold off on sustained outdoor
  exertion until the apparent temperature falls.

  If you're going ahead anyway: move it to before 08:00 or after sunset, cut the duration
  and the intensity, pre-hydrate and carry more water than usual, and stop at the first
  sign of dizziness, headache, cramping, or sweating that stops. Those last two mean get
  into shade immediately -- don't push through them.

compose_notes: >
  Report the "feels like" figure and, where it drove the match, the humidity, because
  the raw air temperature understates the risk here.

rationale: >
  Heat illness tracks apparent temperature rather than dry-bulb temperature. Above
  roughly 38 C apparent, or 33 C with humidity above 75%, evaporative cooling becomes
  unreliable and core temperature can rise during moderate exertion.
